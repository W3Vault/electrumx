name: Remove completed one-time workflow

on:
  push:
    branches:
      - agent/rename-keva-to-wiii

permissions:
  contents: write

jobs:
  remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-wiii-root-marker-hex.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove completed one-time workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
